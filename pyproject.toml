[project]
name = "syncnesto-backend"
version = "0.1.0"
description = "Backend API for Syncnesto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "email-validator>=2.0.0",
    "fastapi==0.142.2",
    "httpx>=0.28.0",
    "psycopg2-binary==2.9.13",
    "certifi>=2025.1.31",
    "pydantic==2.13.5",
    "PyJWT>=2.15.1",
    "python-dotenv>=1.0.0",
    "SQLAlchemy==2.0.49",
    "uvicorn==0.54.0",
    "pwdlib[argon2]>=0.3.0",
    "boto3>=1.43.9",
    "python-multipart>=0.0.32",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.15.15",
]
mcp = [] # 旧ローカル起動コマンドの--extra mcpとの互換性を維持する。

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["no_db: DBを利用せず、DB起動・初期化を省略するテスト"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
