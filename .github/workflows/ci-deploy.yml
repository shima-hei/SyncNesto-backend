name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.10.11
          python-version: '3.14'
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --extra mcp --no-emit-project --no-hashes --output-file /tmp/runtime-requirements.txt --quiet
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip --strict --progress-spinner off -r /tmp/runtime-requirements.txt

  tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.10.11
          python-version: '3.14'
      - run: uv sync --frozen --extra dev --extra mcp
      - name: Run all tests in an isolated shard
        run: uv run --frozen python scripts/verify.py --profile full --shard '${{ matrix.shard }}/2' --timeout 1800
      - name: Preserve complete results even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-tests-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .verify/**/result.json
            .verify/**/report.json
            .verify/**/junit.xml
            .verify/**/full.log

  checks:
    if: always()
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-tests-*
          path: verification-results
      - name: Check complete, disjoint test coverage
        run: python3 scripts/check_verification.py verification-results --shards 2

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://syncnesto-api.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.10.11
          python-version: '3.14'
      - name: Require deployment secrets
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - run: uv sync --frozen --no-dev
      - run: npm install --global vercel@62.2.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: uv run --frozen --no-dev python scripts/configure_demo_deployment.py
      - run: vercel build --prod --local-config=.vercel/deploy-config.json --token="$VERCEL_TOKEN"
      - name: Apply backward-compatible migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DEMO_MIGRATION_DATABASE_URL: ${{ secrets.DEMO_MIGRATION_DATABASE_URL }}
        run: uv run --frozen --no-dev python scripts/migrate_production.py
      - run: vercel deploy --prebuilt --prod --yes --local-config=.vercel/deploy-config.json --token="$VERCEL_TOKEN"
      - name: Verify public API boundary
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors https://syncnesto-api.vercel.app/ --output /dev/null
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://syncnesto-api.vercel.app/auth/me)
          test "$status" = 403
